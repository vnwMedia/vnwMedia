<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Liquid Soldier Chatbot</title>

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      color: #101827;
    }

    .preview {
      padding: 36px;
    }

    .preview h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    .preview p {
      margin: 0;
      color: #64748b;
    }

    /* Floating Chat Button */
    .chat-launcher {
      position: fixed;
      right: 24px;
      bottom: 24px;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: none;
      background: #061326;
      color: #ffffff;
      box-shadow: 0 14px 34px rgba(2, 8, 23, 0.30);
      cursor: pointer;
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .chat-launcher .chat-icon {
      width: 34px;
      height: 34px;
      display: block;
    }

    .chat-launcher .close-icon {
      width: 28px;
      height: 28px;
      display: none;
    }

    .chat-launcher.open .chat-icon {
      display: none;
    }

    .chat-launcher.open .close-icon {
      display: block;
    }

    /* Chat Window */
    .chat-widget {
      position: fixed;
      right: 24px;
      bottom: 104px;
      width: 450px;
      height: 640px;
      max-height: calc(100vh - 130px);
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 18px;
      box-shadow: 0 18px 50px rgba(15, 23, 42, 0.18);
      overflow: hidden;
      z-index: 9999;
      display: none;
      flex-direction: column;
    }

    .chat-widget.open {
      display: flex;
    }

    /* Header */
    .chat-header {
      height: 84px;
      background: #061326;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-logo {
      width: 50px;
      height: 50px;
      border-radius: 12px;
      background: #020817;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
    }

    .brand-logo img {
      width: 48px;
      height: 48px;
      object-fit: contain;
    }

    .brand-title {
      font-size: 18px;
      font-weight: 700;
      line-height: 1.1;
      margin-bottom: 3px;
    }

    .brand-subtitle {
      font-size: 13px;
      line-height: 1.1;
      color: #cbd5e1;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .header-action {
      width: 24px;
      height: 24px;
      border: none;
      background: transparent;
      color: #ffffff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .header-action i {
      font-size: 16px;
      line-height: 1;
    }

    .header-action.close i {
      font-size: 18px;
    }

    /* Messages */
    .messages {
      flex: 1;
      overflow-y: auto;
      background: #ffffff;
      padding: 16px 18px 0;
    }

    .bot-row {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin: 0 0 10px;
    }

    .user-row {
      display: flex;
      justify-content: flex-end;
      margin: 0 0 10px;
    }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #020817;
      object-fit: contain;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .bubble {
      max-width: 82%;
      background: #f3f4f6;
      color: #101827;
      border-radius: 14px;
      padding: 11px 13px;
      font-size: 14px;
      line-height: 1.4;
      white-space: pre-line;
    }

    .user-bubble {
      max-width: 82%;
      background: #2563eb;
      color: #ffffff;
      border-radius: 14px;
      padding: 10px 12px;
      font-size: 14px;
      line-height: 1.4;
      white-space: pre-line;
    }

    .typing-bubble {
      width: 58px;
      height: 30px;
      margin-left: 40px;
      margin-bottom: 10px;
      border-radius: 18px;
      background: #f3f4f6;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    .typing-bubble span {
      width: 6px;
      height: 6px;
      background: #9ca3af;
      border-radius: 50%;
      animation: typingDot 1s infinite ease-in-out;
    }

    .typing-bubble span:nth-child(2) {
      animation-delay: 0.15s;
      background: #4b5563;
    }

    .typing-bubble span:nth-child(3) {
      animation-delay: 0.3s;
    }

    @keyframes typingDot {
      0%, 80%, 100% {
        transform: translateY(0);
        opacity: 0.55;
      }
      40% {
        transform: translateY(-4px);
        opacity: 1;
      }
    }

    /* Choice Buttons */
    .chips {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
      margin: 14px 0 14px 40px;
    }

    .chip {
      min-height: 50px;
      border: 1px solid #cbd5e1;
      border-radius: 11px;
      background: #ffffff;
      color: #0f172a;
      cursor: pointer;
      padding: 9px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      text-align: left;
      transition: all 0.15s ease;
      overflow: hidden;
    }

    .chip:hover {
      border-color: #2563eb;
      background: #f8fbff;
    }

    .chip.full {
      grid-column: 1 / -1;
    }

    .chip-icon {
      width: 32px;
      min-width: 32px;
      height: 24px;
      padding: 0 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #061326;
    }

    .chip-icon i {
      font-size: 13px;
      line-height: 1;
    }

    .chip-label {
      font-size: 13.5px;
      line-height: 1.18;
      white-space: normal;
      overflow: visible;
      color: #111827;
    }

    /* Bottom */
    .powered {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 18px 8px;
      color: #9ca3af;
      font-size: 12px;
      background: #ffffff;
      flex-shrink: 0;
    }

    .powered:before,
    .powered:after {
      content: "";
      height: 1px;
      background: #e5e7eb;
      flex: 1;
    }

    .footer-actions {
      display: flex;
      justify-content: flex-end;
      padding: 0 18px 8px;
      background: #ffffff;
    }

    .restart-btn {
      border: 1px solid #f59e0b;
      background: #fff7ed;
      color: #111827;
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 11px;
      cursor: pointer;
    }

    .input-area {
      height: 74px;
      padding: 10px 18px 14px;
      border-top: 1px solid #e5e7eb;
      background: #ffffff;
      flex-shrink: 0;
    }

    .input-wrap {
      width: 100%;
      height: 50px;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      display: flex;
      align-items: center;
      overflow: hidden;
      background: #ffffff;
    }

    input {
      flex: 1;
      height: 100%;
      min-width: 0;
      border: none;
      outline: none;
      padding: 0 14px;
      font-size: 14px;
      color: #111827;
      background: #ffffff;
    }

    input::placeholder {
      color: #aeb6c3;
    }

    input:disabled {
      cursor: not-allowed;
      color: #aeb6c3;
    }

    .send-btn {
      width: 46px;
      height: 46px;
      border: none;
      background: transparent;
      color: #94a3b8;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .send-btn i {
      font-size: 17px;
      line-height: 1;
    }

    .send-btn:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    @media (max-width: 540px) {
      .chat-widget {
        right: 12px;
        left: 12px;
        bottom: 94px;
        width: auto;
        height: 72vh;
        max-height: none;
      }

      .chat-launcher {
        right: 18px;
        bottom: 18px;
      }

      .chips {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <div class="preview">
    <h1>Liquid Soldier Website Preview</h1>
    <p>Click the chat icon in the bottom-right corner.</p>
  </div>

  <button class="chat-launcher" id="chatLauncher" onclick="toggleChat()" aria-label="Open chat">

      <circle cx="24" cy="32" r="3.5" fill="white"/>

          <i class="fa-solid fa-minus"></i>
        </button>
        <button class="header-action close" onclick="closeChat()" aria-label="Close chat">

      <div class="input-wrap">
        <input id="userInput" placeholder="Ask anything about Liquid Soldier..." maxlength="500" autocomplete="off">

        </button>
      </div>
    </div>
  </div>

<script>

const chatLauncher = document.getElementById("chatLauncher");
const messages = document.getElementById("messages");
const input = document.getElementById("userInput");
const sendBtn = document.getElementById("sendBtn");

let chatStarted = false;
let contactStep = null;
let currentTopic = "";
let conversationHistory = [];
let responsePending = false;

const LEAD_ENDPOINT = ""; // Add the client's secure CRM/webhook endpoint in production.

const qaSections = {

function toggleChat() {
  chatWidget.classList.contains("open") ? closeChat() : openChat();
}

function openChat() {
  chatWidget.classList.add("open");
  chatLauncher.classList.add("open");
  if (!chatStarted) {
    chatStarted = true;
    start();
  }
}

function closeChat() {
  chatWidget.classList.remove("open");
  chatLauncher.classList.remove("open");
}

function enableTyping(placeholder) {
  input.disabled = false;
  sendBtn.disabled = false;
  input.placeholder = placeholder;
  input.focus();
}

function disableTyping() {
  input.disabled = false;
  sendBtn.disabled = false;
  input.value = "";
  input.placeholder = "Ask anything about Liquid Soldier...";
}

function addMessage(text, sender="bot") {
  const row = document.createElement("div");
  row.className = sender === "user" ? "user-row" : "bot-row";

  if (sender === "bot") {
    const avatar = document.createElement("img");
    avatar.src = "assets/liquid-soldier-logo.png";
    avatar.className = "avatar";
    avatar.alt = "Liquid Soldier";
    row.appendChild(avatar);
  }

  const bubble = document.createElement("div");
  bubble.className = sender === "user" ? "user-bubble" : "bubble";
  bubble.textContent = text;
  row.appendChild(bubble);

  messages.appendChild(row);
  conversationHistory.push({ role: sender, text: text, time: new Date().toISOString() });
  messages.scrollTop = messages.scrollHeight;
}

function showTyping(callback, delay=700) {
  const typing = document.createElement("div");
  typing.className = "typing-bubble";
  typing.innerHTML = "<span></span><span></span><span></span>";
  messages.appendChild(typing);
  messages.scrollTop = messages.scrollHeight;

  setTimeout(() => {
    typing.remove();
    callback();
    messages.scrollTop = messages.scrollHeight;
  }, delay);
}

function botSay(text, callback, delay) {
  responsePending = true;
  sendBtn.disabled = true;
  if (typeof delay !== "number") {
    delay = Math.min(1900, 480 + text.length * 8 + Math.random() * 420);
  }
  showTyping(() => {
    addMessage(text, "bot");
    responsePending = false;
    sendBtn.disabled = false;
    if (callback) callback();
  }, delay);
}

function botSequence(items, finalCallback) {
  let index = 0;
  function next() {
    if (index >= items.length) {
      if (finalCallback) finalCallback();
      return;
    }
    botSay(items[index], () => {
      index++;
      setTimeout(next, 250);
    });
  }
  next();
}

function addChips(options) {
  const wrap = document.createElement("div");
  wrap.className = "chips";

  options.forEach(opt => {
    const btn = document.createElement("button");
    btn.className = "chip" + (opt.full ? " full" : "");
    btn.innerHTML = `
      <span class="chip-icon"><i class="${opt.icon || "fa-regular fa-circle"}"></i></span>
      <span class="chip-label">${opt.label}</span>
    `;
    btn.onclick = () => {
      wrap.remove();
      addMessage(opt.label, "user");
      opt.action();
    };
    wrap.appendChild(btn);
  });

  messages.appendChild(wrap);
  messages.scrollTop = messages.scrollHeight;
}

function start() {
  enableTyping("Ask anything about Liquid Soldier...");
  botSequence([
    "Hi, welcome to Liquid Soldier.",
    "What can we help you with?"
  ], () => {
    addChips([
      { label: "For shoppers", icon: "fa-solid fa-cart-shopping", action: shopperStart },
      { label: "For franchise prospects", icon: "fa-regular fa-building", action: franchiseStart },
      { label: "For investors", icon: "fa-solid fa-chart-line", action: investorStart },
      { label: "For community members", icon: "fa-solid fa-users", action: communityStart },
      { label: "For media visitors", icon: "fa-solid fa-bullhorn", action: mediaStart },
      { label: "Common questions", icon: "fa-regular fa-circle-question", action: faqMenu },
      { label: "Contact someone", icon: "fa-solid fa-headset", action: contactStart }
    ]);
  });
}

function normalize(text) {
  return text.toLowerCase().replace(/[^a-z0-9@+.' -]/g, " ").replace(/\s+/g, " ").trim();
}

function wordRoot(word) {
  return word.replace(/(ies|ing|ers|er|ed|es|s)$/i, match => match === "ies" ? "y" : "");
}

function editDistance(a, b) {
  if (Math.abs(a.length - b.length) > 2) return 99;
  const row = Array.from({length:b.length + 1}, (_, i) => i);
  for (let i=1;i<=a.length;i++) {
    let diagonal = row[0]; row[0] = i;
    for (let j=1;j<=b.length;j++) {
      const old = row[j];
      row[j] = Math.min(row[j] + 1, row[j-1] + 1, diagonal + (a[i-1] === b[j-1] ? 0 : 1));
      diagonal = old;
    }
  }
  return row[b.length];
}

function meaningfulWords(text) {
  return normalize(text).split(" ").filter(word => word.length > 2 && !stopWords.has(word));
}

function rankIntents(text) {
  const q = normalize(text);
  const words = meaningfulWords(text);
  const ranked = [];
  intentRules.forEach(rule => {
    let score = 0;
    const evidence = [];
    rule.terms.forEach(term => {
      const cleanTerm = normalize(term);
      if (q.includes(cleanTerm)) {
        score += cleanTerm.includes(" ") ? 7 : 4;
        evidence.push(term);
        return;
      }
      if (!cleanTerm.includes(" ")) {
        const target = wordRoot(cleanTerm);
        words.forEach(word => {
          const root = wordRoot(word);
          if (root === target) { score += 3; evidence.push(word); }
          else if (target.length >= 5 && editDistance(root, target) === 1) { score += 2; evidence.push(word); }
        });
      }
    });
    if (rule.topic === currentTopic && score > 0) score += 2;
    if (score > 0) ranked.push({ topic: rule.topic, score, evidence: [...new Set(evidence)] });
  });
  return ranked.sort((a,b) => b.score - a.score);
}

function detectIntent(text) {
  return rankIntents(text)[0]?.topic || "";
}

function removeChips() {
  document.querySelectorAll(".chips").forEach(chipSet => chipSet.remove());
}

function conversationalChoices(labels) {
  addChips(labels.map(label => ({
    label,
    icon: "fa-regular fa-circle-question",
    full: labels.length < 4,
    action: () => processMessage(label, true)
  })));
}

function isLeadChoice(text) {
  return /^(start (contact|support|franchise|volunteer)|contact support|speak with|share my information|contact someone)/i.test(normalize(text));
}

function processMessage(text, alreadyShown=false) {
  if (!text || responsePending) return;
  removeChips();
  if (!alreadyShown) addMessage(text, "user");
  const q = normalize(text);
  if (q === "restart" || q === "restart form") return restartForm();
  if (contactStep) return captureContactValue(text);
  if (q === "keep chatting") return botSay("Of course. What else would you like to know?", () => conversationalChoices(["Products", "Orders and shipping", "Franchising", "Investing", "Community mission", "Contact someone"]));
  if (q === "submit again") return finishLead();
  if (/^(thanks|thank you|no thanks|that'?s all|done)$/.test(q)) return botSay("You're very welcome. If another question comes up, I'm always here to help. Have a wonderful day!", () => conversationalChoices(["Ask another question", "Close chat"]));
  if (q === "close chat") return closeChat();
  if (q === "ask another question") return botSay("What would you like to know? You can type naturally or choose a topic.", () => conversationalChoices(["Products", "Orders and shipping", "Franchising", "Investing", "Charity and volunteering", "Careers", "Media and partnerships", "Contact someone"]));
  if (isLeadChoice(text)) return contactStart();
  const guidedMap = {
    "find a product":"products", "help with an order":"tracking", "existing order":"tracking",
    "business opportunity":"franchise", "community mission":"charity", "reach a person":"contact",
    "orders and shipping":"shipping", "charity and volunteering":"charity", "media and partnerships":"media"
  };
  const ranked = rankIntents(text);
  if (guidedMap[q]) ranked.unshift({ topic: guidedMap[q], score: 99, evidence: [q] });
  let intent = ranked[0]?.topic || "";
  if (!intent && currentTopic && /^(how much|what.*price|what.*cost|is it safe|how does it work|what about|can i apply|where is it|tell me more|do you have it|is it available)/.test(q)) intent = currentTopic;
  if (intent) {
    currentTopic = intent;
    if (["franchise","franchiseCost","franchiseTraining","franchiseApply"].includes(intent)) lead.visitorType = "Franchise Prospect";
    if (intent === "investing") lead.visitorType = "Investor";
    const [answer, choices] = intentAnswers[intent];
    const family = topic => topic.startsWith("franchise") ? "franchise" : ["shipping","tracking","returns","damaged"].includes(topic) ? "orders" : topic;
    const second = ranked.find(item => family(item.topic) !== family(intent) && item.score >= Math.max(4, ranked[0].score * .55));
    if (second && intentAnswers[second.topic]) {
      const secondLabel = second.topic.replace(/([A-Z])/g, " $1").toLowerCase();
      return botSay(answer + "\n\nI also noticed you may be asking about " + secondLabel + ". Would you like me to cover that next?", () => conversationalChoices(["Tell me about " + secondLabel, ...choices.slice(0,3)]));
    }
    return botSay(answer, () => conversationalChoices(choices));
  }
  const useful = meaningfulWords(text).slice(0,3);
  const acknowledgment = useful.length ? "It sounds like you're asking about “" + useful.join(" ") + ". " : "";
  botSay(acknowledgment + "To connect that with Liquid Soldier, is this mainly about finding a product, getting help with an order, exploring a business opportunity, supporting the community mission, or reaching a person?", () => conversationalChoices(["Find a product", "Help with an order", "Business opportunity", "Community mission", "Reach a person"]));
}

function sendTypedInfo() {
  const text = input.value.trim();
  if (!text || responsePending) return;
  input.value = "";

  if (!contactStep) {
    processMessage(text);
    return;
  }
  addMessage(text, "user");
  captureContactValue(text);
}

function captureContactValue(text) {
  const firstName = (lead.name || "").trim().split(/\s+/)[0];

  if (contactStep === "name") {
    if (text.trim().length < 2) {
      botSay("What first and last name should I use?", () => enableTyping("Type your name..."));
      return;
    }
    lead.name = text;
    contactStep = "email";
    botSay("Thanks, " + text.trim().split(/\s+/)[0] + ". What is the best email address for the team to use?", () => enableTyping("Type your email address..."));
    return;
  }

  if (contactStep === "email") {
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(text)) {
      botSay("Please enter a complete email address, such as name@example.com.", () => enableTyping("Type your email address..."));
      return;
    }
    lead.email = text;
    contactStep = "phone";
    botSay("And what is the best phone number? You can type “skip” if " + firstName + " prefers email only.", () => enableTyping("Phone number or skip..."));
    return;
  }

  if (contactStep === "phone") {
    if (normalize(text) !== "skip" && text.replace(/\D/g, "").length < 7) {
      botSay("Please enter a valid phone number, or type “skip” to continue without one.", () => enableTyping("Phone number or skip..."));
      return;
    }
    lead.phone = normalize(text) === "skip" ? "" : text;
    contactStep = null;
    finishLead();
  }
}

async function deliverLeadPrivately(payload) {
  if (!LEAD_ENDPOINT) {
    console.info("Liquid Soldier lead ready for secure integration.", payload);
    return true;
  }
  const response = await fetch(LEAD_ENDPOINT, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  });
  if (!response.ok) throw new Error("Lead endpoint rejected submission");
  return true;
}

function finishLead() {
  const payload = {
    ...lead,
    topic: currentTopic || "General inquiry",
    conversation: conversationHistory.slice(),
    submittedAt: new Date().toISOString()
  };
  deliverLeadPrivately(payload).then(() => {
    botSay("Thank you, " + (lead.name ? lead.name.trim().split(/\s+/)[0] : "") + "! Your information has been submitted successfully. A member of our team will contact you shortly.", () => {
      conversationalChoices(["Keep chatting", "Close chat"]);
    });
  }).catch(() => {
    botSay("Your details are ready, but the connection needs another moment. Please keep this chat open and try submitting again, or continue chatting with me.", () => {
      conversationalChoices(["Submit again", "Keep chatting"]);
    });
  });
}
