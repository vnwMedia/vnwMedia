<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Liquid Soldier Chatbot Prototype</title>
  <meta name="description" content="Production-style hybrid chatbot prototype for Liquid Soldier.">
  <link rel="stylesheet" href="assets/chatbot.css">
</head>
<body>
  <main class="demo-page" aria-label="Prototype background">
    <div class="demo-copy">
      <img src="assets/liquid-soldier-logo.webp" alt="Liquid Soldier" class="demo-logo">
      <p class="eyebrow">Interactive prototype</p>
      <h1>Liquid Soldier<br>conversation assistant</h1>
      <p>Use the chat button in the lower-right corner. Ask naturally, choose a guided option, switch topics, or request a follow-up.</p>
    </div>
  </main>

  <section class="chat-widget" id="chatWidget" aria-label="Liquid Soldier chat" aria-hidden="true">
    <header class="chat-header">
      <div class="brand">
        <span class="brand-logo"><img src="assets/liquid-soldier-logo.webp" alt=""></span>
        <span><strong>Liquid Soldier</strong><small><i></i> Online — here to help</small></span>
      </div>
      <div class="header-actions">
        <button id="restartBtn" type="button" aria-label="Restart chat" title="Restart chat">↻</button>
        <button id="closeBtn" type="button" aria-label="Close chat" title="Close chat">×</button>
      </div>
    </header>
    <div class="messages" id="messages" role="log" aria-live="polite"></div>
    <div class="privacy-note">Please don’t share passwords, payment-card numbers, or medical records.</div>
    <form class="composer" id="chatForm">
      <label class="sr-only" for="userInput">Type your message</label>
      <textarea id="userInput" rows="1" maxlength="1200" placeholder="Ask a question…" autocomplete="off"></textarea>
      <button id="sendBtn" type="submit" aria-label="Send message">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 4.5 21 12 3.5 19.5l2-6L15 12l-9.5-1.5-2-6Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      </button>
    </form>
  </section>

  <button class="chat-launcher" id="chatLauncher" type="button" aria-label="Open Liquid Soldier chat" aria-expanded="false">
    <img src="assets/liquid-soldier-logo.webp" alt="" class="launcher-logo">
    <svg class="launcher-close" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <span class="unread" id="unread">1</span>
  </button>

  <script>
    window.LIQUID_SOLDIER_CHAT_CONFIG = {
      leadEndpoint: "", // Set to your HTTPS webhook/CRM endpoint.
      requestHeaders: {},
      typingMinMs: 420,
      typingMaxMs: 1450,
      persistSession: true,
      demoSubmissionWhenEndpointMissing: true
    };
  </script>
  <script src="assets/chatbot.js" defer></script>
</body>
</html>
